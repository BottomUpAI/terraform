name: Continuous Integration
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  format:
    name: "Format"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Read Terraform Version
        id: read-terraform-version
        uses: bitterbridge/github-actions/read-terraform-version@v0.0.55

      - name: Setup Terraform
        uses: bitterbridge/github-actions/setup-terraform@v0.0.55
        with:
          terraform-version: ${{ steps.read-terraform-version.outputs.terraform-version }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22

      - name: CloudFront function tests
        run: npm test

      - name: Read Terraform Version
        id: read-terraform-version
        uses: bitterbridge/github-actions/read-terraform-version@v0.0.55

      - name: Setup Terraform
        uses: bitterbridge/github-actions/setup-terraform@v0.0.55
        with:
          terraform-version: ${{ steps.read-terraform-version.outputs.terraform-version }}

      - name: Terraform test
        run: |
          terraform init -backend=false
          terraform test

  plan:
    name: "Plan"
    uses: ./.github/workflows/terraform-apply.yaml
    with:
      apply: false
